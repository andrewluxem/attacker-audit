<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">attacker-audit</title>
<desc id="d">Three panels. 1, where apps built fast tend to fail, quoted from the README: a key in the bundle, a table with row level security off, a server action anyone can call, a webhook nobody verifies, an AI route with no rate limit. 2, the repo's sample report, run against a fictional app: 23 checks, 14 PASS, 6 FAIL, 3 CAN'T TELL, with five checklist rows and their verdicts. 3, the sample's fix order: six failures ranked by likely harm, with a HIGH ranked above a CRITICAL, ending I haven't changed anything yet.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.r3{animation:r3 12s infinite}
.r4{animation:r4 12s infinite}
.r5{animation:r5 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
.rg{animation:rg 12s infinite}
.rh{animation:rh 12s infinite}
.ri{animation:ri 12s infinite}
.rj{animation:rj 12s infinite}
.rk{animation:rk 12s infinite}
@keyframes h1{0%,28%{opacity:1}30%,98%{opacity:0}100%{opacity:1}}
@keyframes h2{0%,30%{opacity:0}32%,58%{opacity:1}60%,100%{opacity:0}}
@keyframes h3{0%,60%{opacity:0}62%,90%{opacity:1}92%,100%{opacity:0}}
@keyframes r1{0%,2%{opacity:0}4%,96%{opacity:1}100%{opacity:0}}
@keyframes r2{0%,5%{opacity:0}7%,96%{opacity:1}100%{opacity:0}}
@keyframes r3{0%,8%{opacity:0}10%,96%{opacity:1}100%{opacity:0}}
@keyframes r4{0%,11%{opacity:0}13%,96%{opacity:1}100%{opacity:0}}
@keyframes r5{0%,14%{opacity:0}16%,96%{opacity:1}100%{opacity:0}}
@keyframes rb{0%,32%{opacity:0}34%,96%{opacity:1}100%{opacity:0}}
@keyframes rc{0%,35%{opacity:0}37%,96%{opacity:1}100%{opacity:0}}
@keyframes rd{0%,38%{opacity:0}40%,96%{opacity:1}100%{opacity:0}}
@keyframes re{0%,41%{opacity:0}43%,96%{opacity:1}100%{opacity:0}}
@keyframes rf{0%,44%{opacity:0}46%,96%{opacity:1}100%{opacity:0}}
@keyframes rg{0%,47%{opacity:0}49%,96%{opacity:1}100%{opacity:0}}
@keyframes rh{0%,62%{opacity:0}64%,96%{opacity:1}100%{opacity:0}}
@keyframes ri{0%,67%{opacity:0}69%,96%{opacity:1}100%{opacity:0}}
@keyframes rj{0%,72%{opacity:0}74%,96%{opacity:1}100%{opacity:0}}
@keyframes rk{0%,78%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">attacker-audit</text>
<text x="229" y="50" class="sans" font-size="13.5" fill="#a9adb2">Read-only agent skill that audits your web app like an attacker</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · WHERE FAST APPS BREAK</text>
<rect x="32" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="242" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">README.md</text>
<line x1="33" y1="123" x2="273" y2="123" stroke="#2e3237"/>
<g class="r1"><rect x="44" y="138" width="3" height="7" fill="#c8963e"/><text x="54" y="145" class="sans" font-size="10.5" fill="#e4dfd4">a key in the bundle</text></g>
<g class="r2"><rect x="44" y="159" width="3" height="7" fill="#c8963e"/><text x="54" y="166" class="sans" font-size="10.5" fill="#e4dfd4">a table with row level security off</text></g>
<g class="r3"><rect x="44" y="180" width="3" height="7" fill="#c8963e"/><text x="54" y="187" class="sans" font-size="10.5" fill="#e4dfd4">a server action anyone can call</text></g>
<g class="r4"><rect x="44" y="201" width="3" height="7" fill="#c8963e"/><text x="54" y="208" class="sans" font-size="10.5" fill="#e4dfd4">a webhook nobody verifies</text></g>
<g class="r5"><rect x="44" y="222" width="3" height="7" fill="#c8963e"/><text x="54" y="229" class="sans" font-size="10.5" fill="#e4dfd4">an AI route with no rate limit</text></g>
<text x="32" y="272" class="sans cap">None of these need a skilled attacker.</text>
</g>

<g>
<text x="294" y="88" class="sans lab" fill="#c8963e">2 · ONE VERDICT PER CHECK</text>
<rect x="294" y="98" width="312" height="152" rx="3" fill="#17191c" stroke="#2e3237"/>
<rect class="hl h2" x="294" y="98" width="312" height="152" rx="3" stroke="#c8963e"/>
<text x="306" y="115" class="mono" font-size="10" fill="#8b9096">examples/sample-report.md</text>
<line x1="295" y1="123" x2="605" y2="123" stroke="#2e3237"/>
<g class="mono" font-size="10" fill="#e4dfd4">
<text class="rb" x="306" y="142">23 checks · 14 PASS · 6 FAIL · 3 CAN'T TELL</text>
<g class="rc"><text x="306" y="165">1.3 Keys in git history</text><text x="514" y="165" fill="#c8963e">FAIL</text></g>
<g class="rd"><text x="306" y="181">2.1 Routes with no session check</text><text x="514" y="181" fill="#c8963e">FAIL</text></g>
<g class="re"><text x="306" y="197">3.1 Tables with RLS off</text><text x="514" y="197" fill="#c8963e">FAIL</text></g>
<g class="rf"><text x="306" y="213">5.2 Unsigned webhooks</text><text x="514" y="213" fill="#93ad8c">PASS</text></g>
<g class="rg"><text x="306" y="229">5.4 Open /admin or debug routes</text><text x="514" y="229" fill="#a9adb2">CAN'T TELL</text></g>
</g>
<text x="294" y="272" class="sans cap">Sample report on a fictional app.</text>
</g>

<g>
<text x="626" y="88" class="sans lab" fill="#93ad8c">3 · RANKED BY LIKELY HARM</text>
<rect x="626" y="98" width="242" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="626" y="98" width="242" height="152" rx="3" stroke="#93ad8c"/>
<text x="638" y="115" class="mono" font-size="10" fill="#8b9096">## Fix order</text>
<line x1="627" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="mono" font-size="10" fill="#e4dfd4">
<g class="rh"><text x="638" y="142">1. 1.3</text><text x="686" y="142" fill="#c8963e">CRITICAL</text><text x="746" y="142" fill="#a9adb2">Effort: minutes.</text></g>
<g class="rh"><text x="638" y="157">2. 3.1</text><text x="686" y="157" fill="#c8963e">CRITICAL</text><text x="746" y="157" fill="#a9adb2">Effort: minutes.</text></g>
<g class="ri"><text x="638" y="172">3. 5.1</text><text x="686" y="172" fill="#e4dfd4">HIGH</text><text x="746" y="172" fill="#a9adb2">Effort: an hour.</text></g>
<g class="ri"><text x="638" y="187">4. 2.1</text><text x="686" y="187" fill="#c8963e">CRITICAL</text><text x="746" y="187" fill="#a9adb2">Effort: minutes.</text></g>
<g class="rj"><text x="638" y="202">5. 3.4</text><text x="686" y="202" fill="#e4dfd4">HIGH</text><text x="746" y="202" fill="#a9adb2">Effort: an hour.</text></g>
<g class="rj"><text x="638" y="217">6. 5.5</text><text x="686" y="217" fill="#a9adb2">LOW</text><text x="746" y="217" fill="#a9adb2">Effort: minutes.</text></g>
</g>
<rect class="ri" x="633" y="161" width="228" height="31" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<g class="rk"><line x1="638" y1="227.5" x2="856" y2="227.5" stroke="#2e3237"/><text x="638" y="243" class="mono" font-size="10" fill="#93ad8c">I haven't changed anything yet.</text></g>
<text x="626" y="272" class="sans" font-size="11.5" fill="#93ad8c">Ranked by how likely each is to hurt you.</text>
</g>
</svg>
